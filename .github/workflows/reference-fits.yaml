# Refits the reference-fit regression suite and compares it with the committed
# reference values (reference-fits/ref/reference.csv). See
# reference-fits/README.md.

on:
  push:
    branches: [main, dev]
    paths:
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'reference-fits/**'
      - '.github/workflows/reference-fits.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'reference-fits/**'
      - '.github/workflows/reference-fits.yaml'
  workflow_dispatch:

name: reference-fits

jobs:
  reference-fits:
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    name: reference fits (${{ matrix.backend }})

    strategy:
      fail-fast: false
      matrix:
        backend: [tmb, rtmb]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Check reference fits
        run: Rscript reference-fits/run.R check --installed --backend ${{ matrix.backend }} --cores 1

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-fits-${{ matrix.backend }}
          path: reference-fits/check-${{ matrix.backend }}.csv
          if-no-files-found: ignore
